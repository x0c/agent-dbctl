name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Privacy & public hygiene check
        run: python3 scripts/check-public.py

      - name: Verify embedded skill matches canonical
        run: |
          python3 -c '
          from pathlib import Path
          a = Path("skills/agent-dbctl/SKILL.md").read_text(encoding="utf-8").strip()
          b = Path("cmd/agent-dbctl/skill.md").read_text(encoding="utf-8").strip()
          assert a == b, "cmd/agent-dbctl/skill.md out of sync"
          '

      - name: Test stable release CI attestation
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build embedded web console
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Test Go packages (Unix with -race)
        if: runner.os != 'Windows'
        env:
          AGENT_DBCTL_NO_SKILL_SYNC: "1"
        run: go test -race -count=1 ./...

      - name: Test Go packages (Windows)
        if: runner.os == 'Windows'
        env:
          AGENT_DBCTL_NO_SKILL_SYNC: "1"
        run: go test -count=1 ./...

      - name: Build CLI binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o dist/agent-dbctl ./cmd/agent-dbctl

  server-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web console and CLI
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build Linux CLI
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-X main.version=smoke -X main.buildCommit=$GITHUB_SHA" -o dist/agent-dbctl ./cmd/agent-dbctl

      - name: Verify Compose, OIDC, remote CLI approvals, and audit
        env:
          AGENT_DBCTL_NO_SKILL_SYNC: "1"
        run: python3 scripts/server_smoke.py --binary "$GITHUB_WORKSPACE/dist/agent-dbctl"
