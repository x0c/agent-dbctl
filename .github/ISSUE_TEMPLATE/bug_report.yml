name: Bug report
description: Report a reproducible defect with real command and platform evidence
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, connection strings, private hostnames, query results, or unredacted audit payloads. Use synthetic data for reproductions.
  - type: input
    id: version
    attributes:
      label: agent-dbctl version
      description: Output of agent-dbctl version --json
      placeholder: "v0.5.0 (commit ...)"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: "Windows 11 amd64, Ubuntu 24.04 arm64, or macOS 15 arm64"
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Database engine and version
      placeholder: "PostgreSQL 16, SQLite, Redis 7, or local mode only"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the exact steps from the default user path. Redact all sensitive values.
      placeholder: |
        1. Run ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the redacted JSON envelope, error.code, OS exit code, and relevant CI link when available.
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Evidence safety
      options:
        - label: I removed credentials, private addresses, personal paths, and sensitive query results from this report.
          required: true
